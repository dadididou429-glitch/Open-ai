<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Agent</title>
  <meta name="theme-color" content="#071a13">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>AI Agent</h1>
        <span class="status"><i></i> الوكيل متصل</span>
      </div>
    </header>

    <main id="messages" class="messages">
      <div class="message agent">
        <div class="bubble">
          مرحباً 👋<br>
          أنا وكيلك الذكي. أخبرني بالمهمة التي تريد مني تنفيذها.
        </div>
      </div>
    </main>

    <div class="typing" id="typing">الوكيل يفكر...</div>

    <form id="chatForm" class="input-area">
      <textarea id="messageInput" placeholder="اكتب مهمتك هنا..." rows="1"></textarea>
      <button type="submit">إرسال</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
